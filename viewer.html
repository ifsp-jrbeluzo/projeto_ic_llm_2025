<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM RAG Logs Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad-1: #09090b;
            --bg-grad-2: #09090b;
            --glass-bg: #18181b;
            --glass-border: #27272a;
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --accent: #d4d4d8;
            --accent-hover: #fafafa;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-primary);
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn {
            border: 1px solid var(--accent);
            color: white;
            background-color: rgba(56, 189, 248, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background-color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 350px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .log-item {
            padding: 15px 20px;
            border-bottom: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .log-item.active {
            background: rgba(56, 189, 248, 0.1);
            border-left: 4px solid var(--accent);
        }

        .log-title {
            font-weight: 600;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .log-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 12px;
            background: var(--success);
            color: #000;
            font-weight: bold;
        }
        
        .status-badge.error {
            background: var(--danger);
            color: #fff;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            position: relative;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .log-detail-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .log-detail-header h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .timestamp {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Cards */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .markdown-body {
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Chunks Accordion */
        .chunk {
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.1);
        }

        .chunk-header {
            padding: 12px 15px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chunk-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .chunk-body {
            padding: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--glass-border);
            display: none;
            line-height: 1.5;
        }

        .chunk.open .chunk-body {
            display: block;
        }

        /* Error box */
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ RAG Logs Dashboard</h1>
        <div class="upload-btn-wrapper">
            <button class="btn">Abrir Pasta de Logs</button>
            <input type="file" id="folderInput" webkitdirectory directory multiple />
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar" id="sidebar">
            <div class="empty-state" style="height: auto; padding: 30px 20px;">
                <p style="font-size: 0.9rem;">Selecione a pasta "logs" para carregar as análises.</p>
            </div>
        </aside>

        <main class="content" id="content">
            <div class="empty-state">
                <h2>Nenhum log selecionado</h2>
                <p>Clique em um item na barra lateral para visualizar os detalhes da extração.</p>
            </div>
        </main>
    </div>

    <script>
        const folderInput = document.getElementById('folderInput');
        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');
        
        let logsData = [];

        // Parse YYYYMMDD_HHMMSS to a readable format
        function formatTimestamp(ts) {
            if (!ts || ts.length < 15) return ts;
            const year = ts.substring(0, 4);
            const month = ts.substring(4, 6);
            const day = ts.substring(6, 8);
            const hour = ts.substring(9, 11);
            const min = ts.substring(11, 13);
            const sec = ts.substring(13, 15);
            return `${day}/${month}/${year} ${hour}:${min}:${sec}`;
        }

        folderInput.addEventListener('change', async (event) => {
            const files = Array.from(event.target.files);
            const jsonFiles = files.filter(f => f.name.endsWith('.json'));
            
            if (jsonFiles.length === 0) {
                alert("Nenhum arquivo .json encontrado na pasta selecionada.");
                return;
            }

            logsData = [];
            sidebar.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8;">Carregando...</div>';

            for (let file of jsonFiles) {
                try {
                    const text = await file.text();
                    const json = JSON.parse(text);
                    json._filename = file.name;
                    logsData.push(json);
                } catch (e) {
                    console.error("Erro ao ler", file.name, e);
                }
            }

            // Sort by article name (natural sort, understands numbers)
            logsData.sort((a, b) => {
                const nameA = a.original_filename || a.collection || a._filename || '';
                const nameB = b.original_filename || b.collection || b._filename || '';
                return nameA.localeCompare(nameB, undefined, { numeric: true, sensitivity: 'base' });
            });

            renderSidebar();
        });

        function renderSidebar() {
            sidebar.innerHTML = '';
            
            if (logsData.length === 0) {
                sidebar.innerHTML = '<div style="padding: 20px; text-align: center; color: #94a3b8;">Nenhum log válido encontrado.</div>';
                return;
            }

            logsData.forEach((log, index) => {
                const el = document.createElement('div');
                el.className = 'log-item';
                
                const hasError = !!log.error;
                
                el.innerHTML = `
                    <div class="log-title">${log.collection || log._filename}</div>
                    <div class="log-meta">
                        <span>${formatTimestamp(log.timestamp)}</span>
                        <span class="status-badge ${hasError ? 'error' : ''}">${hasError ? 'Erro' : 'Sucesso'}</span>
                    </div>
                `;
                
                el.onclick = () => {
                    document.querySelectorAll('.log-item').forEach(i => i.classList.remove('active'));
                    el.classList.add('active');
                    renderContent(log);
                };
                
                sidebar.appendChild(el);
            });
        }

        function toggleChunk(element) {
            element.parentElement.classList.toggle('open');
        }

        function formatMarkdown(text) {
            if (!text) return "Vazio";
            // Simple markdown parser for bold and newlines
            let formatted = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/## (.*?)\n/g, '<h2>$1</h2>\n');
            return formatted;
        }

        function renderBeautifulJSON(obj) {
            if (obj === null || obj === undefined) return `<span style="color: var(--text-secondary)">null</span>`;
            
            if (typeof obj !== 'object') {
                return `<span>${formatMarkdown(String(obj)).replace(/\n/g, '<br>')}</span>`;
            }

            if (Array.isArray(obj)) {
                if (obj.length === 0) return `<span style="color: var(--text-secondary)">[]</span>`;
                let html = `<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 5px;">`;
                obj.forEach(item => {
                    html += `<div style="padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; border-left: 3px solid var(--accent)">${renderBeautifulJSON(item)}</div>`;
                });
                html += `</div>`;
                return html;
            }

            // It's an object
            const keys = Object.keys(obj);
            if (keys.length === 0) return `<span style="color: var(--text-secondary)">{}</span>`;
            
            let html = `<div style="display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 5px;">`;
            keys.forEach(key => {
                html += `
                    <div style="display: flex; flex-direction: column; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border);">
                        <strong style="color: var(--accent); margin-bottom: 6px; font-size: 0.95rem; text-transform: capitalize; letter-spacing: 0.5px;">${key.replace(/_/g, ' ')}</strong>
                        <div style="font-size: 0.95rem; line-height: 1.6; color: var(--text-primary);">${renderBeautifulJSON(obj[key])}</div>
                    </div>
                `;
            });
            html += `</div>`;
            return html;
        }

        function renderContent(log) {
            const hasError = !!log.error;

            const docTitle = log.original_filename || log.collection || 'Desconhecido';
            const chunkSize = log.chunk_size || '?';
            const chunkOverlap = log.chunk_overlap || '?';

            let html = `
                <div class="log-detail-header" style="border-bottom: 1px solid var(--glass-border); padding-bottom: 25px; margin-bottom: 30px;">
                    <h2 style="font-size: 1.6rem; font-weight: 600; margin-bottom: 12px; color: var(--text-primary);">${docTitle}</h2>
                    <div style="display: flex; gap: 15px; align-items: center; font-size: 0.85rem;">
                        <span style="color: var(--text-secondary);">${formatTimestamp(log.timestamp)}</span>
                        <div style="display: flex; gap: 10px; background: var(--glass-bg); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--glass-border);">
                            <span><strong style="color: var(--accent);">Chunk Size:</strong> ${chunkSize}</span>
                            <span style="color: var(--glass-border);">|</span>
                            <span><strong style="color: var(--accent);">Overlap:</strong> ${chunkOverlap}</span>
                        </div>
                    </div>
                </div>
            `;

            if (hasError) {
                html += `
                    <div class="card error-box">
                        <h3>⚠️ Erro de Execução</h3>
                        <div class="markdown-body">${log.error}</div>
                    </div>
                `;
            }

            if (log.interactions && log.interactions.length > 0) {
                log.interactions.forEach((interaction, idx) => {
                    html += `<div style="margin-top: 30px; padding-top: 20px; border-top: 2px dashed rgba(255,255,255,0.1);">
                                <h3 style="color: var(--accent); margin-bottom: 20px; font-size: 1.3rem;">Pergunta ${interaction.question_index || (idx + 1)}</h3>`;
                    
                    if (interaction.response) {
                        let responseContent = "";
                        try {
                            let cleanResponse = interaction.response.replace(/```json\n?|\n?```/g, '').trim();
                            const jsonObj = JSON.parse(cleanResponse);
                            responseContent = renderBeautifulJSON(jsonObj);
                        } catch (e) {
                            responseContent = `<div class="markdown-body">${formatMarkdown(interaction.response).replace(/\n/g, '<br>')}</div>`;
                        }

                        html += `
                            <div class="card" style="border-left: 4px solid var(--success);">
                                <h3>🤖 Resposta Extraída (LLM)</h3>
                                <div style="margin-top: 15px;">${responseContent}</div>
                            </div>
                        `;
                    }

                    if (interaction.chunks && interaction.chunks.length > 0) {
                        html += `
                            <div class="card">
                                <h3>📄 Contexto Recuperado (RAG)</h3>
                                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 15px;">
                                    ${interaction.chunks.length} trechos recuperados do banco de dados vetorial.
                                </p>
                                <div class="chunks-container">
                        `;
                        interaction.chunks.forEach((c, cIdx) => {
                            html += `
                                <div class="chunk">
                                    <div class="chunk-header" onclick="toggleChunk(this)">
                                        <span>Trecho ${cIdx + 1} • Chunk ${c.chunk}</span>
                                        <span style="font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px;">${c.source}</span>
                                    </div>
                                    <div class="chunk-body">${c.text}</div>
                                </div>
                            `;
                        });
                        html += `</div></div>`;
                    }

                    if (interaction.query) {
                        html += `
                            <div class="card">
                                <h3>🔍 Prompt / Query Utilizada</h3>
                                <div class="markdown-body" style="font-size: 0.85rem; color: var(--text-secondary);">${interaction.query}</div>
                            </div>
                        `;
                    }

                    html += `</div>`;
                });
            } else {
                // Lógica antiga de fallback
                if (log.response) {
                    let responseContent = "";
                    try {
                        let cleanResponse = log.response.replace(/```json\n?|\n?```/g, '').trim();
                        const jsonObj = JSON.parse(cleanResponse);
                        responseContent = renderBeautifulJSON(jsonObj);
                    } catch (e) {
                        responseContent = `<div class="markdown-body">${formatMarkdown(log.response).replace(/\n/g, '<br>')}</div>`;
                    }

                    html += `
                        <div class="card" style="border-left: 4px solid var(--success);">
                            <h3>🤖 Resposta Extraída (LLM)</h3>
                            <div style="margin-top: 15px;">${responseContent}</div>
                        </div>
                    `;
                }

                if (log.chunks && log.chunks.length > 0) {
                    html += `
                        <div class="card">
                            <h3>📄 Contexto Recuperado (RAG)</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 15px;">
                                ${log.chunks.length} trechos recuperados do banco de dados vetorial.
                            </p>
                            <div class="chunks-container">
                    `;
                    log.chunks.forEach((c, idx) => {
                        html += `
                            <div class="chunk">
                                <div class="chunk-header" onclick="toggleChunk(this)">
                                    <span>Trecho ${idx + 1} • Chunk ${c.chunk}</span>
                                    <span style="font-size: 0.75rem; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px;">${c.source}</span>
                                </div>
                                <div class="chunk-body">${c.text}</div>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                }

                if (log.query) {
                    html += `
                        <div class="card">
                            <h3>🔍 Prompt / Query Utilizada</h3>
                            <div class="markdown-body" style="font-size: 0.85rem; color: var(--text-secondary);">${log.query}</div>
                        </div>
                    `;
                }
            }

            content.innerHTML = html;
        }
    </script>
</body>
</html>
