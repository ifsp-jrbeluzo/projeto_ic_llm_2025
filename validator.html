<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM RAG - Validador de Resultados</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-grad-1: #09090b;
            --bg-grad-2: #09090b;
            --glass-bg: #18181b;
            --glass-border: #27272a;
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --accent: #d4d4d8;
            --accent-hover: #fafafa;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-grad-1);
            color: var(--text-primary);
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: var(--glass-bg);
            z-index: 10;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        
        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn {
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            background-color: var(--glass-bg);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #27272a;
            border-color: #3f3f46;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: var(--bg-grad-1);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .log-item {
            padding: 15px 20px;
            border-bottom: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .log-item.active {
            background: #18181b;
            border-left: 3px solid var(--accent);
        }

        .log-title {
            font-weight: 600;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .log-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .content {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            position: relative;
        }

        .dashboard-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        .dashboard-state h2 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: var(--text-primary);
        }
        
        .chart-container {
            width: 100%;
            max-width: 800px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .log-detail-header {
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        .comp-box {
            background: #09090b;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 15px;
        }

        .comp-box h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .comp-box div {
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 10px;
            vertical-align: middle;
        }

        .status-100 { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
        .status-0 { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
        .status-partial { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }
        
        .field-title {
            font-size: 1.1rem;
            color: var(--accent);
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <header>
        <h1>Validador de Resultados RAG</h1>
        <div class="header-controls">
            <button class="btn" id="btnDashboard" style="display: none;" onclick="renderDashboard()">Visão Geral</button>
            <div class="upload-btn-wrapper">
                <button class="btn">Carregar validation_results.json</button>
                <input type="file" id="fileInput" accept=".json" />
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <!-- Items rendered via JS -->
        </div>
        <div class="content" id="content">
            <div class="dashboard-state" style="justify-content: center;">
                <h2 style="color: var(--text-secondary);">Nenhum arquivo carregado</h2>
                <p style="color: var(--text-secondary);">Faça o upload do arquivo validation_results.json gerado pelo script</p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');
        const btnDashboard = document.getElementById('btnDashboard');
        
        let chartInstance = null;
        let validationData = [];
        let activeId = null;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    validationData = JSON.parse(evt.target.result);
                    btnDashboard.style.display = 'block';
                    renderSidebar();
                    renderDashboard();
                } catch (err) {
                    alert("Erro ao processar arquivo JSON.");
                    console.error(err);
                }
            };
            reader.readAsText(file);
        });

        function getScoreColor(score) {
            if(score >= 80) return "var(--success)";
            if(score >= 50) return "var(--warning)";
            return "var(--danger)";
        }

        function renderSidebar() {
            sidebar.innerHTML = '';
            
            if (validationData.length === 0) {
                sidebar.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary);">Nenhum dado válido encontrado.</div>';
                return;
            }

            validationData.forEach((item) => {
                const el = document.createElement('div');
                el.className = `log-item ${activeId === item.article_id ? 'active' : ''}`;
                
                const score = item.overall_score || 0;
                let color = getScoreColor(score);

                el.innerHTML = `
                    <div class="log-title">Artigo ${item.article_id}</div>
                    <div class="log-meta">Acerto Geral: <strong style="color: ${color}">${score}%</strong></div>
                `;
                
                el.onclick = () => {
                    activeId = item.article_id;
                    renderSidebar();
                    renderContent(item);
                };
                
                sidebar.appendChild(el);
            });
        }
        
        function renderDashboard() {
            activeId = null;
            renderSidebar();
            
            if(validationData.length === 0) return;
            
            let totalAvg = 0;
            const fieldAvgs = {
                "Área Computacional": [],
                "Sensores Utilizados": [],
                "Bibliotecas, Frameworks ou Arquiteturas": [],
                "Solução / Tarefa Principal": []
            };
            
            validationData.forEach(item => {
                totalAvg += item.overall_score;
                for(let field in item.evaluation) {
                    if(fieldAvgs[field] !== undefined) {
                        fieldAvgs[field].push(item.evaluation[field].score);
                    }
                }
            });
            
            totalAvg = Math.round(totalAvg / validationData.length);
            
            const labels = [];
            const dataPoints = [];
            
            for(let field in fieldAvgs) {
                if(fieldAvgs[field].length > 0) {
                    const avg = Math.round(fieldAvgs[field].reduce((a,b)=>a+b,0) / fieldAvgs[field].length);
                    labels.push(field);
                    dataPoints.push(avg);
                }
            }

            content.innerHTML = `
                <div class="dashboard-state">
                    <h2>Desempenho Geral do RAG: <span style="color: ${getScoreColor(totalAvg)}">${totalAvg}%</span></h2>
                    
                    <div class="chart-container">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>
            `;
            
            const ctx = document.getElementById('mainChart').getContext('2d');
            
            if(chartInstance) {
                chartInstance.destroy();
            }
            
            Chart.defaults.color = '#a1a1aa';
            Chart.defaults.font.family = 'Inter';
            
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Média de Acertos (%)',
                        data: dataPoints,
                        backgroundColor: dataPoints.map(p => {
                            if(p >= 80) return 'rgba(16, 185, 129, 0.7)';
                            if(p >= 50) return 'rgba(245, 158, 11, 0.7)';
                            return 'rgba(239, 68, 68, 0.7)';
                        }),
                        borderColor: dataPoints.map(p => {
                            if(p >= 80) return '#10b981';
                            if(p >= 50) return '#f59e0b';
                            return '#ef4444';
                        }),
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: '#27272a' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function formatValue(val) {
            if (Array.isArray(val)) {
                return val.map(v => `• ${v}`).join('<br>');
            }
            if (val === null || val === undefined) return "<i>Vazio</i>";
            return String(val);
        }

        function renderContent(item) {
            let html = `
                <div class="log-detail-header">
                    <h2 style="font-size: 1.6rem; font-weight: 600; margin-bottom: 12px; color: var(--text-primary);">${item.original_filename}</h2>
                    <div style="font-size: 0.85rem; color: var(--text-secondary);">Média do Artigo: <strong style="color: ${getScoreColor(item.overall_score)}">${item.overall_score}%</strong></div>
                </div>
            `;

            for (const [field, data] of Object.entries(item.evaluation)) {
                let badgeClass = data.score === 100 ? "100" : (data.score === 0 ? "0" : "partial");
                html += `
                    <div class="card">
                        <div style="margin-bottom: 10px;">
                            <span class="field-title">${field}</span>
                            <span class="status-badge status-${badgeClass}">${data.score}%</span>
                        </div>
                        <div class="comparison-grid">
                            <div class="comp-box">
                                <h4>Gabarito (Esperado)</h4>
                                <div>${formatValue(data.expected)}</div>
                            </div>
                            <div class="comp-box">
                                <h4>Extraído pela LLM</h4>
                                <div>${formatValue(data.actual)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            content.innerHTML = html;
        }
    </script>
</body>
</html>
