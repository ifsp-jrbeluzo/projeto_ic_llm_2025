<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM RAG - Validador Neural</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-base: #050505;
            --glass-bg: rgba(24, 24, 27, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(255, 255, 255, 0.2);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --danger: #fb7185;
            --danger-bg: rgba(251, 113, 133, 0.12);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.12);
            --warning: #fbbf24;
            --warning-bg: rgba(251, 191, 36, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            /* Glowing orbs background */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(52, 211, 153, 0.05) 0%, transparent 40%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn {
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            background: linear-gradient(180deg, rgba(39, 39, 42, 0.5) 0%, rgba(24, 24, 27, 0.8) 100%);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
        }

        .btn-primary {
            border-color: rgba(56, 189, 248, 0.4);
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.1) 0%, rgba(2, 132, 199, 0.2) 100%);
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 340px;
            background: rgba(10, 10, 12, 0.5);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        .log-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }

        .log-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.3s ease;
            transform-origin: center;
        }

        .log-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .log-item.active {
            background: rgba(56, 189, 248, 0.05);
        }

        .log-item.active::before {
            transform: scaleY(1);
        }

        .log-title {
            font-weight: 600;
            font-size: 0.90rem;
            color: #e2e8f0;
            word-break: break-word;
            line-height: 1.4;
        }

        .log-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .dashboard-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
            filter: grayscale(1);
        }

        .dashboard-state h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .chart-container {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(12px);
        }

        .log-detail-header {
            margin-bottom: 40px;
            animation: fadeIn 0.4s ease;
        }

        .log-detail-header h2 {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 12px;
            color: #fff;
        }

        .overall-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            animation: fadeIn 0.5s ease;
            animation-fill-mode: both;
        }
        
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
            border-color: var(--glass-border-hover);
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 20px;
        }

        .comp-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 18px;
            height: 100%;
        }

        .comp-box h4 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .comp-box h4::before {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-secondary);
        }

        .comp-expected h4::before { background: var(--accent); }
        .comp-actual h4::before { background: #e2e8f0; }

        .comp-box div {
            font-size: 1rem;
            line-height: 1.6;
            word-break: break-word;
            color: #e2e8f0;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-left: 12px;
            vertical-align: middle;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .status-100 { background: var(--success-bg); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.3); }
        .status-0 { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(251, 113, 133, 0.3); }
        .status-partial { background: var(--warning-bg); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.3); }
        
        .field-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #f8fafc;
            display: inline-block;
            vertical-align: middle;
        }

        .list-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .list-item::before {
            content: '→';
            color: var(--accent);
            margin-right: 8px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <header>
        <h1>Validador RAG <span style="color: var(--text-secondary); font-weight: 400;">v2.0</span></h1>
        <div class="header-controls">
            <button class="btn btn-primary" id="btnDashboard" style="display: none;" onclick="renderDashboard()">Visão Geral Média</button>
            <div class="upload-btn-wrapper">
                <button class="btn">Carregar validation_results.json</button>
                <input type="file" id="fileInput" accept=".json" />
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div style="padding: 30px; text-align: center; color: var(--text-secondary); opacity: 0.7;">
                <div style="font-size: 2rem; margin-bottom: 10px;">📄</div>
                Aguardando arquivo...
            </div>
        </div>
        <div class="content" id="content">
            <div class="dashboard-state" style="justify-content: center;">
                <div class="empty-icon">📊</div>
                <h2 style="color: var(--text-secondary);">Nenhum dado auditado</h2>
                <p style="color: var(--text-secondary); font-size: 1.1rem;">Faça o upload do arquivo gerado pelo pipeline para visualizar a performance.</p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');
        const btnDashboard = document.getElementById('btnDashboard');
        
        let chartInstance = null;
        let validationData = [];
        let activeId = null;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    validationData = JSON.parse(evt.target.result);
                    btnDashboard.style.display = 'block';
                    renderSidebar();
                    renderDashboard();
                } catch (err) {
                    alert("Erro ao processar arquivo JSON.");
                    console.error(err);
                }
            };
            reader.readAsText(file);
        });

        function getScoreColor(score) {
            if(score >= 80) return "var(--success)";
            if(score >= 50) return "var(--warning)";
            return "var(--danger)";
        }

        function renderSidebar() {
            sidebar.innerHTML = '';
            
            if (validationData.length === 0) {
                sidebar.innerHTML = '<div style="padding: 30px; text-align: center; color: var(--text-secondary);">Nenhum dado válido encontrado.</div>';
                return;
            }

            validationData.forEach((item) => {
                const el = document.createElement('div');
                el.className = `log-item ${activeId === item.article_id ? 'active' : ''}`;
                
                const score = item.overall_score || 0;
                let color = getScoreColor(score);

                el.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
                        <div class="log-title">
                            <span style="color: var(--text-secondary); font-size: 0.75rem; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;">Artigo ${item.article_id}</span>
                            ${item.original_filename}
                        </div>
                        <div style="background: ${color}20; border: 1px solid ${color}40; color: ${color}; padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; margin-top: 2px;">
                            ${score}%
                        </div>
                    </div>
                `;
                
                el.onclick = () => {
                    activeId = item.article_id;
                    renderSidebar();
                    renderContent(item);
                };
                
                sidebar.appendChild(el);
            });
        }
        
        function renderDashboard() {
            activeId = null;
            renderSidebar();
            
            if(validationData.length === 0) return;
            
            let totalAvg = 0;
            const fieldAvgs = {
                "Área Computacional": [],
                "Sensores Utilizados": [],
                "Bibliotecas, Frameworks ou Arquiteturas": [],
                "Solução / Tarefa Principal": []
            };
            
            validationData.forEach(item => {
                totalAvg += item.overall_score;
                for(let field in item.evaluation) {
                    if(fieldAvgs[field] !== undefined) {
                        fieldAvgs[field].push(item.evaluation[field].score);
                    }
                }
            });
            
            totalAvg = Math.round(totalAvg / validationData.length);
            
            const labels = [];
            const dataPoints = [];
            
            for(let field in fieldAvgs) {
                if(fieldAvgs[field].length > 0) {
                    const avg = Math.round(fieldAvgs[field].reduce((a,b)=>a+b,0) / fieldAvgs[field].length);
                    labels.push(field);
                    dataPoints.push(avg);
                }
            }

            content.innerHTML = `
                <div class="dashboard-state">
                    <h2 style="color: #fff;">Performance Geral do Pipeline: <span style="color: ${getScoreColor(totalAvg)}">${totalAvg}%</span></h2>
                    
                    <div class="chart-container">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>
            `;
            
            const ctx = document.getElementById('mainChart').getContext('2d');
            
            if(chartInstance) {
                chartInstance.destroy();
            }
            
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = 'Inter';
            
            // Create gradients for bars
            const bgGradients = dataPoints.map(p => {
                const grad = ctx.createLinearGradient(0, 0, 0, 400);
                if(p >= 80) { grad.addColorStop(0, 'rgba(52, 211, 153, 0.8)'); grad.addColorStop(1, 'rgba(52, 211, 153, 0.2)'); }
                else if(p >= 50) { grad.addColorStop(0, 'rgba(251, 191, 36, 0.8)'); grad.addColorStop(1, 'rgba(251, 191, 36, 0.2)'); }
                else { grad.addColorStop(0, 'rgba(251, 113, 133, 0.8)'); grad.addColorStop(1, 'rgba(251, 113, 133, 0.2)'); }
                return grad;
            });

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Média de Acertos (%)',
                        data: dataPoints,
                        backgroundColor: bgGradients,
                        borderColor: dataPoints.map(p => {
                            if(p >= 80) return '#34d399';
                            if(p >= 50) return '#fbbf24';
                            return '#fb7185';
                        }),
                        borderWidth: 1,
                        borderRadius: 8,
                        barPercentage: 0.6
                    }]
                },
                options: {
                    responsive: true,
                    animation: {
                        duration: 1500,
                        easing: 'easeOutQuart'
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { padding: 10 }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 12 } }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(10, 10, 12, 0.9)',
                            titleFont: { size: 14, family: 'Inter' },
                            bodyFont: { size: 14, family: 'Inter' },
                            padding: 12,
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            cornerRadius: 8
                        }
                    }
                }
            });
        }

        function formatValue(val) {
            if (Array.isArray(val)) {
                return val.map(v => `<div class="list-item">${v}</div>`).join('');
            }
            if (val === null || val === undefined) return "<i style='color: var(--text-secondary)'>Não encontrado</i>";
            return String(val);
        }

        function renderContent(item) {
            let html = `
                <div class="log-detail-header">
                    <h2>${item.original_filename}</h2>
                    <div class="overall-badge">
                        Taxa de Extração: <strong style="color: ${getScoreColor(item.overall_score)}; margin-left: 5px; font-size: 1.1rem;">${item.overall_score}%</strong>
                    </div>
                </div>
            `;

            for (const [field, data] of Object.entries(item.evaluation)) {
                let badgeClass = data.score === 100 ? "100" : (data.score === 0 ? "0" : "partial");
                html += `
                    <div class="card">
                        <div style="margin-bottom: 15px;">
                            <span class="field-title">${field}</span>
                            <span class="status-badge status-${badgeClass}">${data.score}%</span>
                        </div>
                        <div class="comparison-grid">
                            <div class="comp-box comp-expected">
                                <h4>Gabarito (Esperado)</h4>
                                <div>${formatValue(data.expected)}</div>
                            </div>
                            <div class="comp-box comp-actual">
                                <h4>Extraído pela IA</h4>
                                <div>${formatValue(data.actual)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            content.innerHTML = html;
        }
    </script>
</body>
</html>
